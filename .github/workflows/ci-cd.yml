name: CI/CD — test, secure, build, performance, deploy (manual)

# Every push / PR: lint, tests, security scans and Docker image build.
# Push to main: + performance (load) test with a downloadable report.
# "Run workflow" (Actions tab): choose a performance test and/or a deployment.
# Deployment ONLY happens when you pick a target; the data lives on the
# platform volume, so a deploy never touches it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy to (none = do not deploy)"
        type: choice
        options: [none, railway, fly, render]
        default: none
      run_perf:
        description: "Run the performance (load) test"
        type: boolean
        default: true
      perf_users:
        description: "Concurrent users per stage (comma separated)"
        type: string
        default: "5,100,1000"
      perf_duration:
        description: "Seconds per stage"
        type: string
        default: "60"
      perf_cpus:
        description: "vCPUs given to the app container"
        type: string
        default: "1"
      perf_memory:
        description: "RAM limit of the app container"
        type: string
        default: "512m"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: fihi-chifae

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app server.py docker-entrypoint.py
      - name: Format check (black)
        run: black --check app server.py tests
      - name: Tests + coverage (each test deletes the data it creates)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -r app -c pyproject.toml -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  build:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif

  # ───────────────────────────── performance ─────────────────────────────
  performance:
    name: Performance (Locust load test)
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && inputs.run_perf)
    needs: [lint-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Locust + report tooling
        run: pip install -r perf/requirements.txt
      - name: Build the production image
        run: docker build -t fihi-chifae:perf .
      - name: Load test (stages of concurrent users) + resource sampling
        env:
          PERF_USERS: ${{ inputs.perf_users || '5,100,1000' }}
          PERF_DURATION: ${{ inputs.perf_duration || '60' }}
          PERF_CPUS: ${{ inputs.perf_cpus || '1' }}
          PERF_MEMORY: ${{ inputs.perf_memory || '512m' }}
          PERF_OUT: perf-results
        run: bash perf/run.sh
      - name: Upload report (open report.html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-results/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────── manual deployments ───────────────────────────
  deploy-railway:
    name: Deploy → Railway
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'railway'
    needs: [lint-test, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy with the Railway CLI (volume /data is kept)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Set the RAILWAY_TOKEN secret and the RAILWAY_SERVICE variable (see deployment-guide.md)"
            exit 1
          fi
          npm install -g @railway/cli
          railway up --service "$RAILWAY_SERVICE" --ci
      - name: Smoke test
        if: vars.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.PUBLIC_URL }}/api/v1/ping" && exit 0
            sleep 10
          done
          exit 1

  deploy-fly:
    name: Deploy → Fly.io
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'fly'
    needs: [lint-test, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (volume fihi_data is kept)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::Set the FLY_API_TOKEN secret"; exit 1; fi
          flyctl deploy --remote-only --ha=false

  deploy-render:
    name: Deploy → Render
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'render'
    needs: [lint-test, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the Render deploy hook (disk /data is kept)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "::error::Set the RENDER_DEPLOY_HOOK secret"; exit 1; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
