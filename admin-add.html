<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إضافة منتج - فيه شفاء</title>
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="assets/admin-auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --green-50:#EEF8F1;--green-100:#DDF0E3;--green-200:#B8E0C8;--green-300:#7EC79B;
      --green-400:#4AAA6F;--green-500:#229D4E;--green-600:#16A34A;--green-700:#12843D;
      --green-800:#0E5E2D;--green-900:#0B4523;--green-950:#07301A;
      --ink:#0B4523;--body:#2E3A32;--muted:#5B6B60;--line:#E3EDE6;--white:#fff;
      --radius:14px;--shadow:0 10px 30px -10px rgba(7,48,26,.22);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Cairo",system-ui,sans-serif;color:var(--body);background:var(--green-50);line-height:1.6;}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

    .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
      background:linear-gradient(90deg,var(--green-800),var(--green-600));color:#fff;padding:.8rem 1.25rem;}
    .brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
    .brand img{height:40px;width:40px;border-radius:10px;object-fit:cover}
    .brand b{color:#BBF7D0}
    .top-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.45rem 1rem;font-weight:700;font-size:.86rem;transition:background .2s,color .2s}
    .btn-light{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
    .btn-light:hover{background:#fff;color:var(--green-800)}

    .wrap{max-width:64rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
    .intro{display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem}
    .intro .pill{background:var(--green-600);color:#fff;font-size:.72rem;font-weight:800;padding:.2rem .6rem;border-radius:999px}
    .intro h1{font-size:1.35rem;color:var(--green-950)}

    .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1.5rem}
    .card h2{font-size:1.05rem;color:var(--green-900);margin-bottom:.9rem}

    .form-grid{display:grid;gap:1rem}
    @media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}}
    .field{display:flex;flex-direction:column;gap:.3rem}
    .field.full{grid-column:1/-1}
    label{font-size:.8rem;font-weight:700;color:var(--green-900)}
    select,input[type=text],input[type=number],input[type=url],input[type=file]{
      height:2.7rem;border:1.5px solid var(--green-200);border-radius:10px;padding:0 .8rem;
      font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;width:100%;
    }
    input[type=file]{padding:.4rem;line-height:1.7}
    select:focus,input:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
    .hint{font-size:.76rem;color:var(--muted)}

    .img-row{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center}
    .img-preview{width:5rem;height:5rem;border-radius:12px;background:var(--green-50);border:1px dashed var(--green-300);display:grid;place-items:center;overflow:hidden}
    .img-preview img{width:100%;height:100%;object-fit:cover}
    .img-preview.empty::after{content:"لا توجد صورة";font-size:.68rem;color:var(--muted);text-align:center}

    .cat-combo{position:relative}
    .cat-combo input{height:2.7rem;border:1.5px solid var(--green-200);border-radius:10px;padding:0 .8rem;font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;width:100%}
    .cat-combo input:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
    .combo-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:220px;overflow-y:auto;display:none;z-index:10}
    .combo-dropdown.show{display:block}
    .combo-item{padding:.55rem .85rem;font-size:.88rem;cursor:pointer;display:flex;flex-direction:column;gap:.1rem}
    .combo-item:hover,.combo-item.active{background:var(--green-50)}
    .combo-item b{font-size:.88rem;color:var(--green-950);font-weight:700}
    .combo-item span{font-size:.72rem;color:var(--muted)}
    .combo-item.create{color:var(--green-700);font-weight:700;border-top:1px solid var(--line)}
    .combo-empty{padding:.8rem;text-align:center;color:var(--muted);font-size:.85rem}

    .btn-submit{height:3rem;border-radius:999px;background:var(--green-600);color:#fff;font-weight:800;font-size:.98rem;
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:background .2s,transform .15s}
    .btn-submit:hover{background:var(--green-800);transform:translateY(-1px)}

    .msg{display:none;padding:.7rem 1rem;border-radius:10px;font-size:.88rem;font-weight:600;margin-top:.8rem}
    .msg.ok{display:block;background:var(--green-100);color:var(--green-800)}
    .msg.err{display:block;background:#FDE8E8;color:#B91C1C}

    .prod-list{display:grid;gap:.7rem}
    .prod-row{display:flex;align-items:center;gap:.8rem;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem}
    .prod-row img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--green-50)}
    .prod-row .info{flex:1;min-width:0}
    .prod-row b{display:block;font-size:.9rem;color:var(--green-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .prod-row span{font-size:.78rem;color:var(--muted)}
    .prod-row .price{font-weight:800;color:var(--green-600);font-size:.9rem;white-space:nowrap}
    .btn-del{color:#B91C1C;width:2.2rem;height:2.2rem;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
    .btn-del:hover{background:#FDE8E8}
    .btn-revoke{color:#B45309;width:2.2rem;height:2.2rem;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
    .btn-revoke:hover{background:#FEF3C7}
    .btn-edit{color:var(--green-700);width:2.2rem;height:2.2rem;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
    .btn-edit:hover{background:var(--green-100)}
    .badge-custom{display:inline-block;background:#DDF0E3;color:#12843D;font-size:.66rem;font-weight:800;border-radius:999px;padding:.05rem .5rem;vertical-align:middle}
    .empty{text-align:center;color:var(--muted);padding:1.2rem 0;font-size:.9rem}
    .prod-row.editing{flex-direction:column;align-items:stretch;padding:.8rem}
    .prod-view{display:flex;align-items:center;gap:.8rem;width:100%}
    .prod-row.editing .prod-view{display:none}
    .prod-edit{display:none;width:100%;gap:.6rem}
    .prod-row.editing .prod-edit{display:grid}
    .prod-edit-grid{display:grid;gap:.6rem}
    @media(min-width:560px){.prod-edit-grid{grid-template-columns:1fr 1fr}}
    .prod-edit input{height:2.4rem;border:1.5px solid var(--green-200);border-radius:9px;padding:0 .7rem;font-size:.88rem;color:var(--ink);background:#fff;width:100%}
    .prod-edit input:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    .prod-edit .edit-cat-wrap{position:relative}
    .prod-edit .combo-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px)}
    .prod-edit-actions{display:flex;gap:.5rem;flex-wrap:wrap}
    .btn-save-sm{background:var(--green-600);color:#fff;height:2.3rem;padding:0 1rem;border-radius:999px;font-weight:800;font-size:.84rem}
    .btn-save-sm:hover{background:var(--green-800)}
    .btn-cancel-sm{background:var(--green-100);color:var(--green-800);height:2.3rem;padding:0 1rem;border-radius:999px;font-weight:700;font-size:.84rem}
    .btn-cancel-sm:hover{background:var(--green-200)}
    .edit-img-row{display:flex;gap:.6rem;align-items:center}
    .edit-img-row input[type=file]{flex:1}

    .foot-bar{max-width:64rem;margin:0 auto;padding:0 1.25rem 2rem}
    .foot-bar a{color:var(--green-700);font-weight:700;font-size:.88rem}
  </style>
</head>
<body>

  <header class="top">
    <div class="brand">
      <img src="assets/logo.jpg" alt="Logo fihi-chifae">
      <span>فيه <b>شفاء</b> · المنتجات</span>
    </div>
    <div class="top-actions">
      <a class="btn btn-light" href="admin.html">← لوحة التحكم</a>
      <a class="btn btn-light" href="index.html">المتجر →</a>
      <button class="btn btn-light" id="btnLogout" title="تسجيل الخروج">تسجيل الخروج</button>
    </div>
  </header>

  <main class="wrap">

    <div class="intro">
      <h1>إضافة منتج</h1>
      <span class="pill">محمي</span>
    </div>

    <section class="card">
      <h2>منتج جديد</h2>
      <form id="productForm" class="form-grid">
        <div class="field">
          <label for="fCat">الفئة</label>
          <div class="cat-combo" id="catCombo">
            <input type="text" id="fCat" autocomplete="off" maxlength="60" placeholder="اكتب الفئة (مثال: عطور، أملو...)">
            <div class="combo-dropdown" id="catDropdown"></div>
          </div>
          <span class="hint" id="catHint">اكتب للتصفية. إذا لم تكن الفئة موجودة، سيتم إنشاؤها تلقائياً.</span>
        </div>
        <div class="field">
          <label for="fPrice">السعر (درهم)</label>
          <input type="number" id="fPrice" min="0" step="0.01" placeholder="350">
        </div>
        <div class="field full">
          <label for="fName">اسم المنتج</label>
          <input type="text" id="fName" placeholder="مثال: عسل الجبل الخالص" required>
        </div>
        <div class="field full">
          <label for="fFile">صورة المنتج</label>
          <div class="img-row">
            <div class="img-preview empty" id="imgPreview"></div>
            <div style="display:grid;gap:.45rem">
              <input type="file" id="fFile" accept="image/png,image/jpeg,image/webp,image/gif">
              <span class="hint">أو الصق رابط الصورة :</span>
              <input type="url" id="fUrl" placeholder="https://.../photo.jpg" style="height:2.3rem">
            </div>
          </div>
        </div>
        <div class="field full">
          <button type="submit" class="btn-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            إضافة المنتج
          </button>
        </div>
      </form>
      <div class="msg" id="msg"></div>
    </section>

    <section class="card">
      <h2>قائمة المنتجات</h2>
      <div id="productList" class="prod-list"><p class="empty">جاري التحميل…</p></div>
    </section>

  </main>

  <div class="foot-bar"><a href="admin.html">← العودة إلى لوحة تحكم المبيعات</a></div>

  <script src="assets/admin-auth.js?v=4"></script>
  <script src="assets/admin-add.js?v=7"></script>
</body>
</html>
