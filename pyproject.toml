[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "B", "C4", "UP", "S"]
lint.ignore = ["S101", "S603", "S607"]
lint.per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import the `app` package with plain `pytest` (as CI runs it)
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
