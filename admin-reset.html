<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>إعادة تعيين كلمة المرور · فيه شفاء</title>
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin-auth.css?v=6">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><img src="assets/logo.jpg" alt="شعار فيه شفاء"><span>فيه <b>شفاء</b></span></div>
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="auth-intro">اختر كلمة مرور جديدة (8 أحرف على الأقل).</p>

    <form id="resetForm" class="auth-form" autocomplete="off" novalidate>
      <div class="auth-field">
        <label for="pw1">كلمة المرور الجديدة</label>
        <input type="password" id="pw1" minlength="8" required placeholder="8 أحرف على الأقل" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="pw2">تأكيد كلمة المرور</label>
        <input type="password" id="pw2" minlength="8" required placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
      </div>
      <button class="btn-login" type="submit">تحديث كلمة المرور</button>
    </form>

    <p id="msg" class="auth-error" role="alert"></p>

    <div id="okBox" class="ok-box" hidden>
      <p>تم تحديث كلمة المرور. يرجى تسجيل الدخول بكلمة المرور الجديدة.</p>
      <a class="btn-login" href="/admin-login.html">تسجيل الدخول</a>
    </div>

    <p class="auth-links"><a href="/admin-login.html">العودة لتسجيل الدخول</a></p>
  </main>
  <script src="assets/admin-reset.js?v=1"></script>
</body>
</html>
