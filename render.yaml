# Optional alternative target (deployed manually from the GitHub "Deploy" workflow).
services:
  - type: web
    name: fihi-chifae
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks require a paid instance
    region: frankfurt
    healthCheckPath: /api/v1/ping
    autoDeploy: false # deploy only when triggered from the workflow
    disk:
      name: fihi-data
      mountPath: /data # both SQLite databases + uploaded images
      sizeGB: 1
    envVars:
      - key: FIHI_DATA_DIR
        value: /data
      - key: FIHI_ADMIN_USER
        sync: false
      - key: FIHI_ADMIN_PASSWORD
        sync: false
      - key: FIHI_ADMIN_EMAIL
        sync: false
      - key: FIHI_PUBLIC_BASE_URL
        sync: false
