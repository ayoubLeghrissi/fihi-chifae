# Optional alternative target (deployed manually from the GitHub "Deploy" workflow).
# One-time setup:  fly launch --no-deploy  &&  fly volumes create fihi_data --size 1 --region cdg
app = "fihi-chifae"
primary_region = "cdg" # Paris - close to Morocco

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FIHI_DATA_DIR = "/data"

# Persistent volume: both SQLite databases + uploaded images survive every release.
[mounts]
  source = "fihi_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/ping"
